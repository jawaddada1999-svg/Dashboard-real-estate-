<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate Dashboard - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
        color: #f1f5f9;
        min-height: 100vh;
        overflow-x: hidden;
        width: 100%;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #00d2ff; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

    .app-shell { display: flex; width: 100%; min-height: 100vh; }

    .sidebar {
        width: 260px;
        flex-shrink: 0;
        background: rgba(2, 6, 23, 0.95);
        border-inline-end: 1px solid #1e293b;
        padding: 28px 20px;
        position: fixed;
        top: 0;
        inset-inline-start: 0;
        height: 100vh;
        overflow-y: auto;
        z-index: 1000;
    }

    .sidebar-header {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 36px; padding-bottom: 20px;
        border-bottom: 1px solid #1e293b;
    }

    .sidebar-logo {
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #00d2ff, #9b51e0);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; font-weight: 800; color: #020617;
    }

    .sidebar-title { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 800; color: #ffffff; }
    .sidebar-menu { display: flex; flex-direction: column; gap: 12px; }

    .menu-btn {
        background: rgba(255,255,255,0.03);
        border: 1px solid #1e293b;
        color: #94a3b8;
        padding: 14px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px; font-weight: 700;
        transition: all .25s ease;
        display: flex; align-items: center; gap: 12px;
        text-align: start; width: 100%;
    }

    .menu-btn:hover { background: rgba(0,210,255,0.08); border-color: rgba(0,210,255,0.3); color: #00d2ff; }
    .menu-btn.active { background: rgba(0,210,255,0.15); border-color: rgba(0,210,255,0.5); color: #5eead4; }

    .main-content {
        flex: 1 1 0%;
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin-inline-start: 260px;
    }

    .header {
        position: sticky; top: 0; z-index: 100;
        background: rgba(2, 6, 23, 0.9);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid #1e293b;
        padding: 24px 32px;
        display: flex; justify-content: space-between; align-items: center;
        gap: 20px; flex-wrap: wrap;
    }

    .header-title { font-family: 'Poppins', sans-serif; font-size: 30px; font-weight: 800; color: #ffffff; }
    .header-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .search-wrap { position: relative; }

    .search-input {
        background: rgba(255,255,255,0.04);
        border: 1px solid #1e293b;
        padding: 11px 16px 11px 40px;
        border-radius: 10px;
        color: #f1f5f9;
        width: 260px;
        font-size: 14px;
        transition: all .25s ease;
    }
    html[dir="rtl"] .search-input { padding: 11px 40px 11px 16px; }

    .search-icon {
        position: absolute; top: 50%; transform: translateY(-50%);
        inset-inline-start: 14px; color: #64748b; font-size: 14px; pointer-events: none;
    }

    .search-input:focus { outline: none; border-color: #00d2ff; box-shadow: 0 0 0 3px rgba(0,210,255,0.15); }
    .search-input::placeholder { color: #64748b; }

    .language-selector {
        background: rgba(255,255,255,0.04);
        border: 1px solid #1e293b;
        color: #f1f5f9;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
