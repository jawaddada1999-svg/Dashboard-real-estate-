<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Dashboard - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2563eb; }

        .container-main {
            display: grid;
            grid-template-columns: 256px 1fr;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-right: 1px solid #334155;
            padding: 24px 20px;
            position: fixed;
            left: 0;
            top: 0;
            width: 256px;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }

        .sidebar-logo {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 800; color: white;
        }

        .sidebar-title {
            font-family: 'Poppins', sans-serif;
            font-size: 18px; font-weight: 800; color: #f1f5f9;
        }

        .sidebar-menu { display: flex; flex-direction: column; gap: 12px; }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px; font-weight: 600;
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 12px;
            position: relative; overflow: hidden;
        }

        .menu-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .menu-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            color: #60a5fa;
        }

        .menu-btn.active::before {
            content: '';
            position: absolute; left: 0; top: 0;
            height: 100%; width: 4px;
            background: linear-gradient(180deg, #3b82f6, #8b5cf6);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-left: 256px;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 1px solid #334155;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-family: 'Poppins', sans-serif;
            font-size: 32px; font-weight: 800; color: #f1f5f9;
        }

        .header-controls { display: flex; gap: 16px; align-items: center; }

        .search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            padding: 10px 16px;
            border-radius: 10px;
            color: #f1f5f9;
            width: 280px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none; border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .search-input::placeholder { color: #64748b; }

        .language-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px; font-weight: 600;
            transition: all 0.3s ease;
        }

        .language-selector:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .language-selector option { background: #0f172a; color: #f1f5f9; }

        .content {
            flex: 1; padding: 32px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 32px; width: 100%;
        }

        .status-banner {
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .status-banner.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            display: block;
        }
        .status-banner.loading {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            display: block;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px; width: 100%;
        }

        .metric-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.05));
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }

        .metric-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.1));
        }

        .metric-content { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
        .metric-info h3 { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 800; color: #f1f5f9; line-height: 1; }
        .metric-icon { font-size: 32px; }

        .filters-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px; width: 100%;
        }

        .filter-chart-block {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .filter-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .filter-label { font-size: 13px; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }

        .filter-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 14px; font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:hover, .filter-select:focus {
            outline: none; border-color: #3b82f6; background: rgba(59, 130, 246, 0.1);
        }
        .filter-select option { background: #0f172a; color: #f1f5f9; }

        .chart-title { font-size: 15px; font-weight: 700; color: #f1f5f9; margin-bottom: 16px; margin-top: 20px; }

        .chart-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            position: relative;
            height: 280px;
            margin-bottom: 16px;
        }

        .chart-legend { display: grid; grid-template-columns: 1fr; gap: 10px; }

        .legend-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.3s ease;
        }

        .legend-item:hover { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3); }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
        .legend-text { font-size: 13px; color: #cbd5e1; flex: 1; }
        .legend-value { font-weight: 700; color: #f1f5f9; font-size: 13px; min-width: 40px; text-align: right; }

        .table-container {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            overflow-x: auto;
            width: 100%;
        }

        .table-title { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 20px; }

        table { width: 100%; border-collapse: collapse; }
        table thead { border-bottom: 2px solid #334155; }
        table th {
            text-align: left; padding: 14px 12px; color: #60a5fa;
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        table td { padding: 14px 12px; border-bottom: 1px solid rgba(51, 65, 85, 0.5); color: #cbd5e1; font-size: 13px; }
        table tbody tr:hover { background: rgba(59, 130, 246, 0.1); transition: background 0.3s ease; }

        .badge {
            display: inline-block; padding: 6px 12px; border-radius: 8px;
            font-size: 12px; font-weight: 600;
            background: rgba(59, 130, 246, 0.2); color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .badge.vip { background: rgba(220, 38, 38, 0.2); color: #f87171; border-color: rgba(220, 38, 38, 0.3); }
        .badge.warm { background: rgba(249, 115, 22, 0.2); color: #fb923c; border-color: rgba(249, 115, 22, 0.3); }
        .badge.cold { background: rgba(6, 182, 212, 0.2); color: #67e8f9; border-color: rgba(6, 182, 212, 0.3); }

        .comparison-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.05));
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .comparison-title { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 800; color: #f1f5f9; margin-bottom: 28px; }
        .comparison-table-wrapper { overflow-x: auto; width: 100%; }
        .comparison-table { width: 100%; border-collapse: collapse; min-width: 100%; }
        .comparison-table thead {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.1));
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
        }
        .comparison-table th {
            padding: 16px; text-align: left; color: #60a5fa;
            font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            border-right: 1px solid #334155;
        }
        .comparison-table th:last-child { border-right: none; }
        .comparison-table td {
            padding: 16px; border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            color: #cbd5e1; font-size: 14px; border-right: 1px solid rgba(51, 65, 85, 0.3);
        }
        .comparison-table td:last-child { border-right: none; }
        .comparison-table tbody tr:hover { background: rgba(59, 130, 246, 0.15); transition: background 0.3s ease; }

        .metric-name { font-weight: 600; color: #e2e8f0; background: rgba(255, 255, 255, 0.02); }
        .value-previous, .value-current { text-align: center; font-family: 'Poppins', sans-serif; font-weight: 700; color: #60a5fa; }
        .value-growth { text-align: center; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .growth-positive { color: #10b981; font-size: 18px; }
        .growth-negative { color: #ef4444; font-size: 18px; }
        .growth-neutral { color: #94a3b8; font-size: 18px; }
        .growth-percent { font-weight: 700; color: inherit; }

        @media (max-width: 1400px) { .filters-section { grid-template-columns: repeat(2, 1fr); } }

        @media (max-width: 1024px) {
            .container-main { grid-template-columns: 1fr; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #334155; padding: 20px; }
            .main-content { margin-left: 0; }
            .sidebar-menu { flex-direction: row; flex-wrap: wrap; }
            .menu-btn { flex: 1; min-width: 150px; }
            .filters-section { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 16px; align-items: flex-start; }
            .header-controls { width: 100%; flex-direction: column; }
            .search-input { width: 100%; }
        }

        @media (max-width: 768px) {
            .content { padding: 16px; gap: 16px; }
            .header { padding: 16px; }
            .header-title { font-size: 24px; }
            .metrics-grid { grid-template-columns: 1fr; }
            .comparison-section { padding: 16px; }
            .comparison-title { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📊</div>
                <div class="sidebar-title">Dashboard</div>
            </div>
            <div class="sidebar-menu">
                <button class="menu-btn active" onclick="switchSection('dashboard')">📊 <span id="menu-dashboard">لوحة التحكم</span></button>
                <button class="menu-btn" onclick="switchSection('analytics')">📈 <span id="menu-analytics">التحليلات</span></button>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div class="header-title" id="header-title">لوحة التحكم</div>
                <div class="header-controls">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث..." oninput="updateDashboard()">
                    <select class="language-selector" id="languageSelect" onchange="changeLanguage(this.value)">
                        <option value="ar">العربية</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
            </div>

            <div class="content">
                <div id="dashboard-section">
                    <div class="status-banner" id="statusBanner"></div>
                    <div class="metrics-grid" id="metricsGrid"></div>

                    <div class="filters-section">
                        <div class="filter-chart-block">
                            <div class="filter-group">
                                <label class="filter-label" id="label-classification">🎯 التصنيف</label>
                                <select class="filter-select" id="classificationFilter" onchange="updateDashboard()">
                                    <option value="all">الكل</option>
                                    <option value="VIP">VIP 🔥</option>
                                    <option value="WARM">WARM 🪵</option>
                                    <option value="COLD">COLD ❄️</option>
                                </select>
                            </div>
                            <div class="chart-title" id="chart-title-class">توزيع التصنيف</div>
                            <div class="chart-container"><canvas id="classificationChart"></canvas></div>
                            <div class="chart-legend" id="classificationLegend"></div>
                        </div>

                        <div class="filter-chart-block">
                            <div class="filter-group">
                                <label class="filter-label" id="label-status">⏳ الحالة</label>
                                <select class="filter-select" id="statusFilter" onchange="updateDashboard()">
                                    <option value="all">الكل</option>
                                    <option value="Nouveau">Nouveau 🆕</option>
                                    <option value="EnCours">En cours ⏳</option>
                                    <option value="Vendu">Vendu ✅</option>
                                    <option value="Perdu">Perdu ❌</option>
                                </select>
                            </div>
                            <div class="chart-title" id="chart-title-status">توزيع الحالة</div>
                            <div class="chart-container"><canvas id="statusChart"></canvas></div>
                            <div class="chart-legend" id="statusLegend"></div>
                        </div>

                        <div class="filter-chart-block">
                            <div class="filter-group">
                                <label class="filter-label" id="label-property">🏠 نوع العقار</label>
                                <select class="filter-select" id="propertyFilter" onchange="updateDashboard()">
                                    <option value="all">الكل</option>
                                    <option value="Apartment">شقة 🏢</option>
                                    <option value="Villa">فيلا 🏰</option>
                                    <option value="Commercial">محل تجاري 🏪</option>
                                </select>
                            </div>
                            <div class="chart-title" id="chart-title-property">توزيع نوع العقار</div>
                            <div class="chart-container"><canvas id="propertyChart"></canvas></div>
                            <div class="chart-legend" id="propertyLegend"></div>
                        </div>
                    </div>

                    <div class="table-container">
                        <div class="table-title" id="table-title-clients">📋 جدول العملاء</div>
                        <table>
                            <thead>
                                <tr>
                                    <th id="th-name">الاسم</th>
                                    <th id="th-phone">الهاتف</th>
                                    <th id="th-budget">الميزانية</th>
                                    <th id="th-type">النوع</th>
                                    <th id="th-status">الحالة</th>
                                    <th id="th-classification">التصنيف</th>
                                </tr>
                            </thead>
                            <tbody id="leadsTableBody"></tbody>
                        </table>
                    </div>

                    <div class="comparison-section">
                        <h3 class="comparison-title" id="comparison-title">📊 جدول المقارنة الشهري المفصل</h3>
                        <div class="comparison-table-wrapper">
                            <table class="comparison-table">
                                <thead>
                                    <tr>
                                        <th id="comp-th-metric">المؤشر / الفئة</th>
                                        <th id="comp-th-previous">الشهر الماضي</th>
                                        <th id="comp-th-current">هذا الشهر</th>
                                        <th id="comp-th-growth">نسبة التطور %</th>
                                    </tr>
                                </thead>
                                <tbody id="comparisonTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="analytics-section" style="display: none; text-align: center; padding: 60px 20px; color: #94a3b8;">
                    <div style="font-size: 64px; margin-bottom: 20px;">📈</div>
                    <p style="font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 10px;">قسم التحليلات المتقدمة</p>
                    <p>سيتم إضافة المزيد من التقارير والرسوم البيانية قريباً</p>
                </div>
            </div>
        </div>
    </div>

<script>
(function () {
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQz9JgepSHyiEXcin3VkIgx5jGnQfdTTJKxCTuAsJMslONSZcSJj1GLEkaynd4lIksZpc2ht933QUcM/pub?output=csv';
    var CORS_PROXY = 'https://corsproxy.io/?';

    var allData = [];
    var currentLanguage = 'ar';
    var chartInstances = {};

    var VIBRANT_COLORS = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#ef4444', '#6366f1', '#f472b6', '#14b8a6'];

    var translations = {
        ar: { 'header-title': 'لوحة التحكم', 'menu-dashboard': 'لوحة التحكم', 'menu-analytics': 'التحليلات',
            'label-classification': '🎯 التصنيف', 'label-status': '⏳ الحالة', 'label-property': '🏠 نوع العقار',
            'chart-title-class': 'توزيع التصنيف', 'chart-title-status': 'توزيع الحالة', 'chart-title-property': 'توزيع نوع العقار',
            'table-title-clients': '📋 جدول العملاء', 'th-name': 'الاسم', 'th-phone': 'الهاتف', 'th-budget': 'الميزانية',
            'th-type': 'النوع', 'th-status': 'الحالة', 'th-classification': 'التصنيف',
            'comparison-title': '📊 جدول المقارنة الشهري المفصل', 'comp-th-metric': 'المؤشر / الفئة',
            'comp-th-previous': 'الشهر الماضي', 'comp-th-current': 'هذا الشهر', 'comp-th-growth': 'نسبة التطور %',
            'metric-total-clients': '👥 مجموع العملاء', 'metric-avg-budget': '💰 متوسط الميزانية', 'metric-vip-clients': '⭐ عملاء VIP' },
        en: { 'header-title': 'Dashboard', 'menu-dashboard': 'Dashboard', 'menu-analytics': 'Analytics',
            'label-classification': '🎯 Classification', 'label-status': '⏳ Status', 'label-property': '🏠 Property Type',
            'chart-title-class': 'Classification Distribution', 'chart-title-status': 'Status Distribution', 'chart-title-property': 'Property Type Distribution',
            'table-title-clients': '📋 Clients Table', 'th-name': 'Name', 'th-phone': 'Phone', 'th-budget': 'Budget',
            'th-type': 'Type', 'th-status': 'Status', 'th-classification': 'Classification',
            'comparison-title': '📊 Monthly Comparison Table', 'comp-th-metric': 'Metric',
            'comp-th-previous': 'Previous Month', 'comp-th-current': 'Current Month', 'comp-th-growth': 'Growth %',
            'metric-total-clients': '👥 Total Clients', 'metric-avg-budget': '💰 Average Budget', 'metric-vip-clients': '⭐ VIP Clients' },
        fr: { 'header-title': 'Tableau de Bord', 'menu-dashboard': 'Tableau de Bord', 'menu-analytics': 'Analytiques',
            'label-classification': '🎯 Classification', 'label-status': '⏳ Statut', 'label-property': '🏠 Type de Propriété',
            'chart-title-class': 'Distribution Classification', 'chart-title-status': 'Distribution Statuts', 'chart-title-property': 'Distribution Types',
            'table-title-clients': '📋 Tableau des Clients', 'th-name': 'Nom', 'th-phone': 'Téléphone', 'th-budget': 'Budget',
            'th-type': 'Type', 'th-status': 'Statut', 'th-classification': 'Classification',
            'comparison-title': '📊 Tableau de Comparaison Mensuel', 'comp-th-metric': 'Métrique',
            'comp-th-previous': 'Mois Précédent', 'comp-th-current': 'Mois Actuel', 'comp-th-growth': 'Croissance %',
            'metric-total-clients': '👥 Total Clients', 'metric-avg-budget': '💰 Budget Moyen', 'metric-vip-clients': '⭐ Clients VIP' }
    };

    function t(key) { return (translations[currentLanguage] && translations[currentLanguage][key]) || key; }

    function updateTranslations() {
        Object.keys(translations[currentLanguage]).forEach(function (key) {
            var el = document.getElementById(key);
            if (el) el.textContent = translations[currentLanguage][key];
        });
    }

    window.changeLanguage = function (lang) {
        currentLanguage = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        updateTranslations();
        updateDashboard();
    };

    window.switchSection = function (section) {
        document.getElementById('dashboard-section').style.display = section === 'dashboard' ? 'block' : 'none';
        document.getElementById('analytics-section').style.display = section === 'analytics' ? 'block' : 'none';
        var btns = document.querySelectorAll('.menu-btn');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        if (window.event && window.event.target) {
            window.event.target.closest('.menu-btn').classList.add('active');
        }
    };

    function showBanner(msg, type) {
        var b = document.getElementById('statusBanner');
        b.textContent = msg;
        b.className = 'status-banner ' + type;
    }
    function hideBanner() {
        var b = document.getElementById('statusBanner');
        b.className = 'status-banner';
        b.textContent = '';
    }

    function parseCSV(text) {
        var rows = text.split(/\r?\n/).filter(function (r) { return r.trim().length > 0; });
        if (rows.length < 2) return [];
        var headers = rows[0].split(',').map(function (h) { return h.trim().toLowerCase().replace(/"/g, ''); });
        return rows.slice(1).map(function (row) {
            var values = row.split(',').map(function (v) { return v.trim().replace(/"/g, ''); });
            var obj = {};
            headers.forEach(function (h, i) { obj[h] = values[i] || ''; });
            return obj;
        }).filter(function (r) { return Object.values(r).some(function (v) { return v; }); });
    }

    function fetchData() {
        showBanner(currentLanguage === 'ar' ? '⏳ جاري تحميل البيانات...' : 'Loading data...', 'loading');

        fetch(CSV_URL)
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function (csv) {
                allData = parseCSV(csv);
                hideBanner();
                updateDashboard();
            })
            .catch(function (err) {
                console.error('Direct fetch failed, trying proxy:', err);
                fetch(CORS_PROXY + encodeURIComponent(CSV_URL))
                    .then(function (res) {
                        if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
                        return res.text();
                    })
                    .then(function (csv) {
                        allData = parseCSV(csv);
                        hideBanner();
                        updateDashboard();
                    })
                    .catch(function (err2) {
                        console.error('Proxy fetch also failed:', err2);
                        showBanner(currentLanguage === 'ar'
                            ? '❌ تعذر تحميل البيانات من الشيت. تأكد من أن الرابط منشور بشكل صحيح (File > Share > Publish to web).'
                            : '❌ Could not load data from the sheet.', 'error');
                        allData = [];
                        updateDashboard();
                    });
            });
    }

    function parseBudget(budgetStr) {
        if (!budgetStr) return 0;
        var match = budgetStr.match(/\d+/);
        return match ? parseInt(match[0], 10) : 0;
    }

    function getFilteredData() {
        var classFilter = document.getElementById('classificationFilter').value;
        var statusFilter = document.getElementById('statusFilter').value;
        var propertyFilter = document.getElementById('propertyFilter').value;
        var searchTerm = document.getElementById('searchInput').value.toLowerCase();

        return allData.filter(function (item) {
            var classMatch = classFilter === 'all' || (item['classification'] || '').includes(classFilter);
            var statusMatch = statusFilter === 'all' || (item['status'] || '').includes(statusFilter);
            var propertyMatch = propertyFilter === 'all' || (item['type'] || '').includes(propertyFilter);
            var searchMatch = !searchTerm ||
                (item['name'] || item['nom'] || '').toLowerCase().includes(searchTerm) ||
                (item['phone'] || item['telephone'] || '').includes(searchTerm);
            return classMatch && statusMatch && propertyMatch && searchMatch;
        });
    }

    function getCurrentMonthData() {
        var today = new Date();
        return allData.filter(function (item) {
            var d = new Date(item['date'] || today);
            return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
        });
    }

    function getPreviousMonthData() {
        var today = new Date();
        var pm = today.getMonth() - 1, py = today.getFullYear();
        if (pm < 0) { pm = 11; py--; }
        return allData.filter(function (item) {
            var d = new Date(item['date'] || today);
            return d.getMonth() === pm && d.getFullYear() === py;
        });
    }

    function calcGrowth(cur, prev) {
        if (prev === 0) return cur > 0 ? 100 : 0;
        return (((cur - prev) / prev) * 100).toFixed(1);
    }

    function updateMetrics() {
        var filtered = getFilteredData();
        var total = filtered.length;
        var avgBudget = filtered.length > 0
            ? Math.round(filtered.reduce(function (s, d) { return s + parseBudget(d['budget'] || d['budgets'] || '0'); }, 0) / filtered.length)
            : 0;
        var vip = filtered.filter(function (d) { return (d['classification'] || '').includes('VIP'); }).length;

        document.getElementById('metricsGrid').innerHTML =
            '<div class="metric-card"><div class="metric-content"><div class="metric-info"><h3>' + t('metric-total-clients') + '</h3><div class="metric-value">' + total + '</div></div><div class="metric-icon">👥</div></div></div>' +
            '<div class="metric-card"><div class="metric-content"><div class="metric-info"><h3>' + t('metric-avg-budget') + '</h3><div class="metric-value">' + avgBudget + 'M</div></div><div class="metric-icon">💰</div></div></div>' +
            '<div class="metric-card"><div class="metric-content"><div class="metric-info"><h3>' + t('metric-vip-clients') + '</h3><div class="metric-value">' + vip + '</div></div><div class="metric-icon">⭐</div></div></div>';
    }

    function getChartData() {
        var filtered = getFilteredData();
        var classData = {
            'VIP 🔥': filtered.filter(function (d) { return (d['classification'] || '').includes('VIP'); }).length,
            'WARM 🪵': filtered.filter(function (d) { return (d['classification'] || '').includes('WARM'); }).length,
            'COLD ❄️': filtered.filter(function (d) { return (d['classification'] || '').includes('COLD'); }).length
        };
        var statusData = {
            'Nouveau 🆕': filtered.filter(function (d) { return (d['status'] || '').includes('Nouveau'); }).length,
            'En cours ⏳': filtered.filter(function (d) { return (d['status'] || '').includes('cours'); }).length,
            'Vendu ✅': filtered.filter(function (d) { return (d['status'] || '').includes('Vendu'); }).length,
            'Perdu ❌': filtered.filter(function (d) { return (d['status'] || '').includes('Perdu'); }).length
        };
        var propertyData = {
            'شقة 🏢': filtered.filter(function (d) { return (d['type'] || '').includes('Apartment'); }).length,
            'فيلا 🏰': filtered.filter(function (d) { return (d['type'] || '').includes('Villa'); }).length,
            'محل تجاري 🏪': filtered.filter(function (d) { return (d['type'] || '').includes('Commercial'); }).length
        };
        return { classData: classData, statusData: statusData, propertyData: propertyData };
    }

    function renderCharts() {
        var cd = getChartData(), classData = cd.classData, statusData = cd.statusData, propertyData = cd.propertyData;

        if (chartInstances.classification) chartInstances.classification.destroy();
        chartInstances.classification = new Chart(document.getElementById('classificationChart'), {
            type: 'doughnut',
            data: { labels: Object.keys(classData), datasets: [{ data: Object.values(classData), backgroundColor: VIBRANT_COLORS.slice(0, 3), borderColor: '#1e293b', borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        if (chartInstances.status) chartInstances.status.destroy();
        chartInstances.status = new Chart(document.getElementById('statusChart'), {
            type: 'bar',
            data: { labels: Object.keys(statusData), datasets: [{ data: Object.values(statusData), backgroundColor: VIBRANT_COLORS.slice(0, 4), borderColor: '#334155', borderWidth: 1, borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                scales: { y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { ticks: { color: '#94a3b8' }, grid: { display: false } } } }
        });

        if (chartInstances.property) chartInstances.property.destroy();
        chartInstances.property = new Chart(document.getElementById('propertyChart'), {
            type: 'pie',
            data: { labels: Object.keys(propertyData), datasets: [{ data: Object.values(propertyData), backgroundColor: VIBRANT_COLORS.slice(3, 6), borderColor: '#1e293b', borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        renderLegends(classData, statusData, propertyData);
    }

    function renderLegends(classData, statusData, propertyData) {
        function build(data, colorOffset) {
            return Object.entries(data).map(function (item, i) {
                return '<div class="legend-item"><div class="legend-color" style="background:' + VIBRANT_COLORS[i + colorOffset] + '"></div><span class="legend-text">' + item[0] + '</span><span class="legend-value">' + item[1] + '</span></div>';
            }).join('');
        }
        document.getElementById('classificationLegend').innerHTML = build(classData, 0);
        document.getElementById('statusLegend').innerHTML = build(statusData, 0);
        document.getElementById('propertyLegend').innerHTML = build(propertyData, 3);
    }

    function renderLeadsTable() {
        var filtered = getFilteredData();
        document.getElementById('leadsTableBody').innerHTML = filtered.slice(0, 15).map(function (item) {
            var badge = 'badge';
            var cls = item['classification'] || '';
            if (cls.includes('VIP')) badge = 'badge vip';
            else if (cls.includes('WARM')) badge = 'badge warm';
            else if (cls.includes('COLD')) badge = 'badge cold';
            return '<tr><td>' + (item['name'] || item['nom'] || '-') + '</td><td>' + (item['phone'] || item['telephone'] || '-') +
                '</td><td>' + (item['budget'] || '-') + '</td><td>' + (item['type'] || '-') +
                '</td><td><span class="badge">' + (item['status'] || '-') + '</span></td><td><span class="' + badge + '">' + (cls || '-') + '</span></td></tr>';
        }).join('') || '<tr><td colspan="6" style="text-align:center;color:#64748b;">لا توجد بيانات</td></tr>';
    }

    function renderComparisonTable() {
        var cur = getCurrentMonthData(), prev = getPreviousMonthData();
        var names = currentLanguage === 'ar'
            ? ['👥 مجموع العملاء', '🏢 الشقق', '🏰 الفيلات', '🏪 المحلات التجارية', '🔥 العملاء VIP', '🪵 العملاء WARM', '❄️ العملاء COLD']
            : ['👥 Total Clients', '🏢 Apartments', '🏰 Villas', '🏪 Commercial Shops', '🔥 VIP Clients', '🪵 WARM Clients', '❄️ COLD Clients'];

        var metrics = [
            { name: names[0], current: cur.length, previous: prev.length },
            { name: names[1], current: cur.filter(function (d) { return (d['type'] || '').includes('Apartment'); }).length, previous: prev.filter(function (d) { return (d['type'] || '').includes('Apartment'); }).length },
            { name: names[2], current: cur.filter(function (d) { return (d['type'] || '').includes('Villa'); }).length, previous: prev.filter(function (d) { return (d['type'] || '').includes('Villa'); }).length },
            { name: names[3], current: cur.filter(function (d) { return (d['type'] || '').includes('Commercial'); }).length, previous: prev.filter(function (d) { return (d['type'] || '').includes('Commercial'); }).length },
            { name: names[4], current: cur.filter(function (d) { return (d['classification'] || '').includes('VIP'); }).length, previous: prev.filter(function (d) { return (d['classification'] || '').includes('VIP'); }).length },
            { name: names[5], current: cur.filter(function (d) { return (d['classification'] || '').includes('WARM'); }).length, previous: prev.filter(function (d) { return (d['classification'] || '').includes('WARM'); }).length },
            { name: names[6], current: cur.filter(function (d) { return (d['classification'] || '').includes('COLD'); }).length, previous: prev.filter(function (d) { return (d['classification'] || '').includes('COLD'); }).length }
        ];

        document.getElementById('comparisonTableBody').innerHTML = metrics.map(function (m) {
            var g = calcGrowth(m.current, m.previous), gn = parseFloat(g), gHtml;
            if (gn > 0) gHtml = '<span class="growth-positive">📈</span><span class="growth-percent">+' + g + '%</span>';
            else if (gn < 0) gHtml = '<span class="growth-negative">📉</span><span class="growth-percent">' + g + '%</span>';
            else gHtml = '<span class="growth-neutral">➖</span><span class="growth-percent">0%</span>';
            return '<tr><td class="metric-name">' + m.name + '</td><td class="value-previous">' + m.previous + '</td><td class="value-current">' + m.current + '</td><td class="value-growth">' + gHtml + '</td></tr>';
        }).join('');
    }

    window.updateDashboard = function () {
        try {
            updateMetrics();
            renderCharts();
            renderLeadsTable();
            renderComparisonTable();
        } catch (e) {
            console.error('Render error:', e);
            showBanner(currentLanguage === 'ar' ? '⚠️ وقع خطأ أثناء عرض البيانات، شوف الـ console.' : '⚠️ Render error, check console.', 'error');
        }
    };

    document.addEventListener('DOMContentLoaded', function () {
        fetchData();
        updateTranslations();
    });
})();
</script>
</body>
</html>
